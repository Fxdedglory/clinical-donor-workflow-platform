[project]
name = "clinical-donor-workflow-platform"
version = "0.1.0"
description = "Clinical donor screening, QMS, audit, and vendor SLA workflow simulator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "bcrypt<4",
    "fastapi>=0.115.0",
    "faker>=37.0.0",
    "pandas>=2.2.0",
    "passlib[bcrypt]>=1.7.4",
    "plotly>=5.24.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.36",
    "streamlit>=1.41.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
