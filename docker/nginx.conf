events {}

http {
    upstream clinical_frontend {
        server frontend:8501;
    }

    upstream clinical_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name teemails.com www.teemails.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name teemails.com www.teemails.com;

        ssl_certificate /etc/letsencrypt/live/teemails.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/teemails.com/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 25m;

        location /api/ {
            proxy_pass http://clinical_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /health {
            proxy_pass http://clinical_backend;
        }

        location / {
            proxy_pass http://clinical_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
